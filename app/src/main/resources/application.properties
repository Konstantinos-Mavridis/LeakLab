quarkus.application.name=leaklab
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.enable-compression=true
# The UI must never be stale: the same port serves a different JVM or build after a rebuild, and the default
# (public, immutable, max-age=24h) would keep the old app.js in the browser for a day.
quarkus.http.static-resources.caching-enabled=false
quarkus.banner.enabled=false

quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.category."io.leaklab".level=INFO

# Probes: /q/health/live and /q/health/ready. Liveness must NOT depend on memory pressure,
# otherwise probe-kills mask the real failure mode (and also show up as exit code 137).
quarkus.smallrye-health.ui.enabled=false

# Prometheus at /q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# LeakLab
leaklab.scenario=${LEAKLAB_SCENARIO:local}
leaklab.dump-dir=${LEAKLAB_DUMP_DIR:/dumps}
%dev.leaklab.dump-dir=target/dumps
%test.leaklab.dump-dir=target/dumps
leaklab.guardian.enabled=${LEAKLAB_GUARDIAN_ENABLED:true}
leaklab.guardian.threshold=${LEAKLAB_GUARDIAN_THRESHOLD:0.90}
leaklab.guardian.rearm=${LEAKLAB_GUARDIAN_REARM:0.75}
leaklab.load.mode=${LEAKLAB_LOAD_MODE:HEAP}
leaklab.load.keep-running-on-oom=${LEAKLAB_LOAD_KEEP_RUNNING_ON_OOM:false}

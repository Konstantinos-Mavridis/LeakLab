# Scenario M · manual — your own sizing. Edit the values below, then apply this overlay on its own:
#   kubectl apply -k deploy/k8s/overlays/manual && kubectl port-forward svc/leaklab-manual 8080
# Change a value and apply again: the Deployment rolls out a new pod with the new sizing.
# On OpenShift, add "- ../k8s/overlays/manual" to deploy/openshift/kustomization.yaml (it is left out by default).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -manual
labels:
  - pairs:
      leaklab.io/scenario: manual
    includeSelectors: true
patches:
  - target: { kind: Deployment, name: leaklab }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leaklab
      spec:
        template:
          spec:
            containers:
              - name: leaklab
                env:
                  - name: LEAKLAB_SCENARIO
                    value: manual
                  # The most common production setting: 75 % of the limit and nothing else. Try -Xmx, other
                  # percentages, -XX:MaxDirectMemorySize, -XX:+UseG1GC, -XX:+ExitOnOutOfMemoryError, …
                  - name: JAVA_OPTS
                    value: -XX:MaxRAMPercentage=75
                  - name: LEAKLAB_LOAD_MODE              # leak target at start: HEAP | DIRECT | NATIVE
                    value: HEAP
                  - name: LEAKLAB_GUARDIAN_ENABLED       # false: watch an OOMKill leave no evidence
                    value: "true"
                  - name: LEAKLAB_GUARDIAN_THRESHOLD     # fraction of the limit
                    value: "0.90"
                  - name: LEAKLAB_LOAD_KEEP_RUNNING_ON_OOM   # true: the load engine does not pause after an OOM
                    value: "false"
                resources:
                  requests: { cpu: 500m, memory: 1Gi }   # keep requests.memory == limits.memory
                  limits: { memory: 1Gi }                # the container limit

# Scenario A · sized — heap sized as a share of the limit, with real native headroom, and direct memory capped.
# A heap leak ends in java.lang.OutOfMemoryError with dumps in /dumps: HotSpot (the default image) writes an .hprof,
# OpenJ9 heapdump + javacore + snap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -sized
labels:
  - pairs:
      leaklab.io/scenario: sized
    includeSelectors: true
patches:
  - target: { kind: Deployment, name: leaklab }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leaklab
      spec:
        template:
          spec:
            containers:
              - name: leaklab
                env:
                  - name: LEAKLAB_SCENARIO
                    value: sized
                  - name: JAVA_OPTS
                    value: -XX:MaxRAMPercentage=60 -XX:MaxDirectMemorySize=96m
                resources:
                  requests: { cpu: 500m, memory: 1Gi }
                  limits: { memory: 1Gi }
